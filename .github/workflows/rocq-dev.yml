name: Rocq release smoke

# Test the locked release, not upstream nightly compatibility.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocq-release-smoke-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/install-nix-action@v27
      - name: Check release compiler, Stdlib and Equations computation
        run: nix develop --no-update-lock-file --command bash scripts/check-release-toolchain.sh
