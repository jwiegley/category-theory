name: Docker CI

on: [push, pull_request]

jobs:
  config-check:
    # Guard the make/coq_makefile build configuration that the Coq bench
    # (opam install) relies on; see issue #158. Pure file inspection, so it
    # runs on the bare runner in seconds without the Coq toolchain.
    runs-on: ubuntu-latest
    outputs:
      skip_opam: ${{ steps.release.outputs.skip_opam }}
    steps:
      - name: Select the release build
        id: release
        shell: bash
        env:
          PUSH_REF: ${{ github.event.ref }}
        run: |
          # Git refs are case-sensitive; Actions expression equality is not.
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$PUSH_REF" == refs/heads/rocq-22721 ]]; then skip=true; fi
          echo "skip_opam=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bench build-config regression guard (issue #158)
        run: make bench-config-check
      - name: Bench build-config guard self-test (reject path, issue #158)
        run: make bench-config-check-selftest
      - name: CLAUDE.md file-count guard
        run: make claude-md-counts-check
      - name: doc/INDEX.md section-heading guard
        run: make index-check

  build:
    name: Rocq 9.3.0 opam build and install
    # Not on pushes to rocq-22721, a planned branch for source the released
    # Rocq rejects; .github/workflows/rocq-upstream.yml builds it instead
    # (doc/UPSTREAM.md).
    needs: config-check
    # A failed config check is still reported; it need not suppress the build.
    if: ${{ !cancelled() && needs.config-check.outputs.skip_opam != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build checkout in the released Linux switch
        env:
          IMAGE: rocq/rocq-prover@sha256:97a68f230e785726c3bab4ba17e1d416fdd630de4af4548eb49b08712f29af93
        run: |
          git archive HEAD | docker run --rm -i --platform linux/amd64 "$IMAGE" bash -ec '
            src=$(mktemp -d); cd "$src"; tar xf -
            bash scripts/opam-release-build.sh
          '
