# The unreleased Rocq this branch is built against by scripts/build-upstream-rocq.sh
# and .github/workflows/rocq-upstream.yml. See doc/UPSTREAM.md.
#
# Lines are KEY=VALUE and are read as data, not run as shell.
# A REPO uses https://, ssh://, file:/// or an absolute local path.
# A REF is one of:
#   a branch name                      master
#   a full ref                         refs/heads/master, refs/tags/V9.3.0, refs/pull/22721/head
#   a full lowercase 40-hex commit ID      which pins the build
ROCQ_REPO=https://github.com/rocq-prover/rocq
ROCQ_REF=refs/pull/22721/head
STDLIB_REPO=https://github.com/mattam82/stdlib
STDLIB_REF=universes-and-variances-global
EQUATIONS_REPO=https://github.com/mattam82/Coq-Equations
EQUATIONS_REF=universes-and-variances-global
