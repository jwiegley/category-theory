pre-commit:
  parallel: true
  commands:
    whitespace:
      glob: "*.v"
      run: "! grep -rn '[[:blank:]]$' {staged_files} 2>/dev/null | head -5 | grep -q ."
    admitted:
      glob: "*.v"
      run: |
        current=$(grep -ciE '(Admitted\.|[^_]admit|Abort\.)' {staged_files} 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
        baseline=$(cat .admitted-baseline 2>/dev/null || echo 0)
        total=$(find . -name '*.v' -print0 | xargs -0 grep -ciE '(Admitted\.|[^_]admit|Abort\.)' 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
        if [ "$total" -gt "$baseline" ]; then
          echo "Admitted proof count increased ($total > $baseline)"
          exit 1
        fi
    bench-config:
      glob: "{_CoqProject,*.opam,dune,dune-project}"
      run: make -s bench-config-check
    claude-md-counts:
      glob: "{CLAUDE.md,_CoqProject,*.v}"
      run: make -s claude-md-counts-check
    index-check:
      glob: "doc/INDEX.md"
      run: make -s index-check
    rocq-22721-check:
      glob: "{*.v,*.nix,flake.lock,_CoqProject,Makefile,lefthook.yml,CLAUDE.md,doc/PROBE_ARITY.md,.admitted-baseline,.github/rocq-upstream.conf,.github/workflows/*.yml,scripts/build-upstream-rocq.sh,scripts/check_rocq_22721.py,scripts/probe_arity*,scripts/test_probe_arity.py}"
      run: >-
        bash -euo pipefail -c 'tree=$(git write-tree);
        git cat-file blob "$tree:scripts/check_rocq_22721.py" | python3 -IB - "$tree"'
